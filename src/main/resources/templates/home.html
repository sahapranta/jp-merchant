<!DOCTYPE html>
<html th:replace="~{layout :: layout(
    title='Dashboard — EduBill',
    content=~{::main})}"
    xmlns:th="http://www.thymeleaf.org">
<body>
<main>
    <div class="page-body">
        <h1 class="page-title">Dashboard</h1>

        <div class="row g-4">
            <div class="col-md-6">
                <a href="/bills/create" class="text-decoration-none">
                    <div class="card border-0 shadow-sm h-100" style="border-radius:16px;cursor:pointer;transition:transform .15s,box-shadow .15s"
                         onmouseover="this.style.transform='translateY(-3px)';this.style.boxShadow='0 8px 25px rgba(0,0,0,.1)'"
                         onmouseout="this.style.transform='';this.style.boxShadow=''">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center py-5">
                            <div class="rounded-circle d-flex align-items-center justify-content-center mb-3"
                                 style="width:64px;height:64px;background:linear-gradient(135deg,#6C2F9B,#8B4EC8)">
                                <i class="bi bi-plus-circle text-white" style="font-size:1.6rem"></i>
                            </div>
                            <h5 class="card-title fw-semibold" style="color:#1a1a2e">Create Bill</h5>
                            <p class="card-text text-muted text-center small">Create a new bill, define fees, and publish for students</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6">
                <div class="card border-0 shadow-sm h-100" style="border-radius:16px">
                    <div class="card-body d-flex flex-column align-items-center justify-content-center py-5">
                        <div class="rounded-circle d-flex align-items-center justify-content-center mb-3"
                             style="width:64px;height:64px;background:linear-gradient(135deg,#E57347,#f0986c)">
                            <i class="bi bi-receipt text-white" style="font-size:1.6rem"></i>
                        </div>
                        <h5 class="card-title fw-semibold" style="color:#1a1a2e">All Bills</h5>
                        <p class="card-text text-muted text-center small">View, manage, and track all published and draft bills</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
