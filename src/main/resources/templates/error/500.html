<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Server Error — EduBill</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #f4f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1.5rem; }
        .error-card { text-align: center; max-width: 480px; }
        .error-code { font-family: 'DM Serif Display', serif; font-size: 6rem; font-weight: 700; line-height: 1; background: linear-gradient(135deg, #E57347, #d93a3a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .error-icon { display: inline-flex; align-items: center; justify-content: center; width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #E57347, #d93a3a); margin-bottom: 1.5rem; }
        .error-icon i { font-size: 2.2rem; color: #fff; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon"><i class="bi bi-exclamation-triangle"></i></div>
        <div class="error-code">500</div>
        <h4 class="fw-semibold mt-2" style="color:#1a1a2e">Server Error</h4>
        <p class="text-muted mt-2 mb-4">Something went wrong on our end. Please try again later.</p>
        <a href="/" class="btn btn-lg px-4" style="background:#1a1a2e;color:#fff;border-radius:10px;font-weight:500">
            <i class="bi bi-arrow-clockwise me-1"></i> Try Again
        </a>
    </div>
</body>
</html>
