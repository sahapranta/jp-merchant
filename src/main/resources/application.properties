spring.application.name=merchant
spring.main.banner-mode=off

# ── Server ──────────────────────────────────────────────────
server.port=8080

# ── H2 DB (memory default; override via env for Docker) ────
# Docker: jdbc:h2:file:/data/edubilldb;MODE=MySQL;AUTO_RECONNECT=TRUE
spring.datasource.url=jdbc:h2:mem:edubilldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── H2 Console ──────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ── SQL Init (schema only; seed data handled by DataSeeder) ─
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ── Thymeleaf ───────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ── File Upload ─────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ── Logging ─────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.jpay=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR

# ── App Custom ──────────────────────────────────────────────
app.biller.default-id=1
app.bill.code-prefix=BILL

